 web_custom_header: "सर्व "अपलोड नाकारले" पृष्ठांच्या अगदी सुरुवातीला HTML म्हणून समाविष्ट केले आहे. तुम्हाला वेबसाइटचा लोगो, वैयक्तिक शीर्षलेख, स्क्रिप्ट्स, किंवा तत्सम अशा सर्व पृष्ठांवर समाविष्ट करायचे असल्यास हे उपयुक्त ठरू शकते."
 web_forbid_on_block: "phpMussel ने फाइल अपलोड अवरोधित केलेल्या संदेशासह 403 शीर्षलेख पाठवावे किंवा नेहमीच्या 200 OK सह चिकटवावे? False = नाही (200); True = होय (403) [डीफॉल्ट]."
 web_ignore_upload_errors: "तुमच्या विशिष्ट प्रणालीवर phpMussel च्या योग्य कार्यक्षमतेसाठी आवश्यक नसल्यास हे निर्देश सहसा अक्षम केले जावे. अक्षम केल्यावर, जेव्हा <code>$_FILES</code> array() मध्ये घटक असतील, तेव्हा phpMussel त्या फायलींचे स्कॅन सुरू करण्याचा प्रयत्न करेल ज्याचे ते घटक प्रतिनिधित्व करतात, आणि ते घटक रिक्त किंवा रिक्त असल्यास, phpMussel एक त्रुटी संदेश देईल. हे phpMussel साठी योग्य वर्तन आहे. तथापि, काही CMS साठी, <code>$_FILES</code> मधील रिकामे घटक त्या CMS च्या नैसर्गिक वर्तनाचा परिणाम म्हणून उद्भवू शकतात किंवा कोणतीही नसताना त्रुटी नोंदवल्या जाऊ शकतात, आणि अशा परिस्थितीत, phpMussel चे सामान्य वर्तन त्या CMS च्या सामान्य वर्तनात हस्तक्षेप करेल. तुमच्या बाबतीत अशी परिस्थिती उद्भवल्यास, ही सूचना सक्षम असताना, phpMussel अशा रिकाम्या घटकांसाठी स्कॅन सुरू करण्याचा प्रयत्न करणार नाही, सापडल्यावर त्याकडे दुर्लक्ष करेल, आणि संबंधित त्रुटी संदेश परत करणार नाही, अशा प्रकारे पृष्ठ विनंती सुरू ठेवण्याची परवानगी देते. False = अक्षम करा; True = सक्षम करा."
 web_magnification: "फॉन्ट मॅग्निफिकेशन. डीफॉल्ट = 1."
 web_max_uploads: "स्कॅन रद्द करण्यापूर्वी अपलोड स्कॅन करताना phpMussel ला स्कॅन करण्याची परवानगी असलेल्या फायलींची कमाल संख्या आणि वापरकर्त्याला ते एकाच वेळी खूप अपलोड करत आहेत याची माहिती देतात! सैद्धांतिक हल्ल्यापासून संरक्षण प्रदान करते ज्याद्वारे आक्रमणकर्ता PHP प्रक्रिया धीमा करण्यासाठी phpMussel ओव्हरलोड करून तुमची सिस्टम किंवा CMS DDoS करण्याचा प्रयत्न करतो. शिफारस: 10. तुमच्या हार्डवेअरच्या गतीनुसार तुम्ही हा नंबर वाढवू किंवा कमी करू शकता. लक्षात घ्या की हा नंबर संग्रहणांच्या सामग्रीचा हिशोब देत नाही किंवा समाविष्ट करत नाही."
 web_theme: "अवरोधित कार्यक्रम आणि कॅप्चा रिक्वेस्टसाठी वापरायची थीम."
