 web_max_uploads:
  pa-IN: "ਫਾਈਲਾਂ ਦੀ ਵੱਧ ਤੋਂ ਵੱਧ ਸੰਖਿਆ ਜੋ phpMussel ਨੂੰ ਅਪਲੋਡਾਂ ਨੂੰ ਸਕੈਨ ਕਰਨ ਵੇਲੇ ਸਕੈਨ ਕਰਨ ਦੀ ਇਜਾਜ਼ਤ ਹੈ। ਜਦੋਂ ਇਹ ਅਧਿਕਤਮ ਵੱਧ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਸਕੈਨ ਨੂੰ ਅਧੂਰਾ ਛੱਡ ਦਿੱਤਾ ਜਾਵੇਗਾ, ਅਤੇ ਉਪਭੋਗਤਾ ਨੇ ਸੂਚਿਤ ਕੀਤਾ ਕਿ ਉਹ ਇੱਕ ਵਾਰ ਵਿੱਚ ਬਹੁਤ ਜ਼ਿਆਦਾ ਅੱਪਲੋਡ ਕਰ ਰਹੇ ਹਨ। ਇੱਕ ਸਿਧਾਂਤਕ ਹਮਲੇ ਤੋਂ ਸੁਰੱਖਿਆ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ ਜਿਸ ਵਿੱਚ ਇੱਕ ਹਮਲਾਵਰ PHP ਪ੍ਰਕਿਰਿਆ ਨੂੰ ਹੌਲੀ ਕਰਨ ਲਈ phpMussel ਨੂੰ ਓਵਰਲੋਡ ਕਰਕੇ ਤੁਹਾਡੇ ਸਿਸਟਮ ਜਾਂ CMS ਨੂੰ DDoS ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰਦਾ ਹੈ। ਸਿਫਾਰਸ਼ੀ: 10. ਤੁਸੀਂ ਆਪਣੇ ਹਾਰਡਵੇਅਰ ਦੀ ਗਤੀ ਦੇ ਆਧਾਰ 'ਤੇ ਇਸ ਨੰਬਰ ਨੂੰ ਵਧਾਉਣ ਜਾਂ ਘਟਾਉਣਾ ਚਾਹ ਸਕਦੇ ਹੋ। ਨੋਟ ਕਰੋ ਕਿ ਇਹ ਸੰਖਿਆ ਪੁਰਾਲੇਖਾਂ ਦੀ ਸਮੱਗਰੀ ਲਈ ਲੇਖਾ ਜਾਂ ਸ਼ਾਮਲ ਨਹੀਂ ਕਰਦਾ ਹੈ।"
  [pa-160, pa-Arab, pa-PK]: "اپ لوڈ سکین کردے ویلے phpMussel نوں سکین کرن آلی فائلاں دی ودھ توں ودھ تعداد۔ جدوں ایہ ودھ توں ودھ ہو جاندا اے، تے سکین بند کر دتا جائے گا، تے ورتن آلے نو اطلاع دتی جائے گی کہ اوہ اک واری چ بہوں زیادہ اپ لوڈ کر رئے نے۔ اک نظریاتی حملے دے خلاف تحفظ فراہم کردا اے جس وچ اک حملہ آور پی ایچ پی دے عمل نو سست کرن دے لی phpMussel نو اوورلوڈ کرکے تہاڈے سسٹم یا سی ایم ایس نو ڈی ڈی او ایس کرن دی کوشش کردا اے۔ تجویز کردہ: 10۔ تسی اپنے ہارڈویئر دی رفتار دے لحاظ نال اس تعداد نو ودھانا یا گھٹانا چاہ سکدے او۔ نوٹ کرو کہ ایہ نمبر آرکائیوز دے مواد دا حساب یا اس وچ شامل نئيں ا ے۔"
