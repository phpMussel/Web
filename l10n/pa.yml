  pa-IN: "ਸਾਰੇ "ਅਪਲੋਡ ਕਰਨ ਤੋਂ ਇਨਕਾਰ ਕੀਤਾ" ਪੰਨਿਆਂ ਦੇ ਬਿਲਕੁਲ ਹੇਠਾਂ HTML ਦੇ ਰੂਪ ਵਿੱਚ ਸ਼ਾਮਲ ਕੀਤਾ ਗਿਆ। ਇਹ ਉਪਯੋਗੀ ਹੋ ਸਕਦਾ ਹੈ ਜੇਕਰ ਤੁਸੀਂ ਅਜਿਹੇ ਸਾਰੇ ਪੰਨਿਆਂ 'ਤੇ ਕਾਨੂੰਨੀ ਨੋਟਿਸ, ਸੰਪਰਕ ਲਿੰਕ, ਕਾਰੋਬਾਰੀ ਜਾਣਕਾਰੀ, ਜਾਂ ਸਮਾਨ ਸ਼ਾਮਲ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ।"
  [pa-160, pa-Arab, pa-PK]: "سارے "اپ لوڈ ڈینائیڈ" صفحیاں دے بالکل تھلے HTML دے طور تے شامل کیتا گیا اے۔ جے تسی قانونی نوٹس، رابطے دے لنکس، کاروباری معلومات، یا ایس طرحاں دے سارے صفحیاں تے شامل کرنا چاہندے او تے ایہ کم آ سکدا اے۔"
 web_custom_header:
  pa-IN: "ਸਾਰੇ "ਅਪਲੋਡ ਕਰਨ ਤੋਂ ਇਨਕਾਰ ਕੀਤਾ" ਪੰਨਿਆਂ ਦੇ ਸ਼ੁਰੂ ਵਿੱਚ HTML ਦੇ ਰੂਪ ਵਿੱਚ ਸ਼ਾਮਲ ਕੀਤਾ ਗਿਆ। ਇਹ ਉਪਯੋਗੀ ਹੋ ਸਕਦਾ ਹੈ ਜੇਕਰ ਤੁਸੀਂ ਅਜਿਹੇ ਸਾਰੇ ਪੰਨਿਆਂ 'ਤੇ ਇੱਕ ਵੈਬਸਾਈਟ ਲੋਗੋ, ਵਿਅਕਤੀਗਤ ਸਿਰਲੇਖ, ਸਕ੍ਰਿਪਟਾਂ, ਜਾਂ ਸਮਾਨ ਸ਼ਾਮਲ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ।"
  [pa-160, pa-Arab, pa-PK]: "سارے "اپ لوڈ انکار" صفحیاں دے شروع چ HTML شامل کیتا گیا۔ جے تسی ویب سائٹ دا لوگو، انفرادی ہیڈر، سکرپٹ، یا اجہے سارے صفحیاں تے شامل کرنا چاہندے او تے ایہ کم آ سکدا اے۔"
 web_forbid_on_block:
  pa-IN: "ਕੀ phpMussel ਨੂੰ ਫਾਈਲ ਅਪਲੋਡ ਬਲੌਕ ਕੀਤੇ ਸੁਨੇਹੇ ਦੇ ਨਾਲ 403 ਸਿਰਲੇਖ ਭੇਜਣੇ ਚਾਹੀਦੇ ਹਨ, ਜਾਂ ਆਮ 200 OK ਨਾਲ ਜੁੜੇ ਰਹਿਣਾ ਚਾਹੀਦਾ ਹੈ? False = ਨਹੀਂ (200); True = ਹਾਂ (403) [ਡਿਫਾਲਟ]।"
  [pa-160, pa-Arab, pa-PK]: "کی phpMussel نو فائل اپ لوڈ بلاک شدہ سنیہا دے نال 403 ہیڈر بھیجنا چاہیدا اے، یا معمول دے 200 نال رہنا چاہیدا اے ٹھیک اے؟ غلط = نئیں (200); سچ = ہاں (403) [پہلے توں طے شدہ]۔"
 web_ignore_upload_errors:
  pa-IN: "ਇਹ ਨਿਰਦੇਸ਼ ਆਮ ਤੌਰ 'ਤੇ ਅਕਿਰਿਆਸ਼ੀਲ ਹੋਣਾ ਚਾਹੀਦਾ ਹੈ, ਪਰ ਕੁਝ ਮਾਮਲਿਆਂ ਵਿੱਚ phpMussel ਨੂੰ ਤੁਹਾਡੇ ਖਾਸ ਸਿਸਟਮ 'ਤੇ ਸਹੀ ਢੰਗ ਨਾਲ ਕੰਮ ਕਰਨ ਲਈ ਇਸਨੂੰ ਕਿਰਿਆਸ਼ੀਲ ਕਰਨਾ ਜ਼ਰੂਰੀ ਹੋ ਸਕਦਾ ਹੈ। ਆਮ ਤੌਰ 'ਤੇ, ਜਦੋਂ ਅਕਿਰਿਆਸ਼ੀਲ ਹੁੰਦਾ ਹੈ, ਜਦੋਂ phpMussel <code>$_FILES</code> array() ਵਿੱਚ ਤੱਤਾਂ ਦੀ ਮੌਜੂਦਗੀ ਦਾ ਪਤਾ ਲਗਾਉਂਦਾ ਹੈ, ਉਹਨਾਂ ਤੱਤਾਂ ਦੁਆਰਾ ਦਰਸਾਈਆਂ ਗਈਆਂ ਫਾਈਲਾਂ ਦੀ ਸਕੈਨ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕੀਤੀ ਜਾਵੇਗੀ, ਅਤੇ, ਜੇਕਰ ਉਹ ਤੱਤ ਖਾਲੀ ਹਨ, ਤਾਂ phpMussel ਇੱਕ ਗਲਤੀ ਸੁਨੇਹਾ ਵਾਪਸ ਕਰੇਗਾ। ਇਹ phpMussel ਲਈ ਸਹੀ ਵਿਵਹਾਰ ਹੈ। ਹਾਲਾਂਕਿ, ਕੁਝ CMS ਲਈ, <code>$_FILES</code> ਵਿੱਚ ਖਾਲੀ ਤੱਤ ਉਹਨਾਂ CMS ਦੇ ਕੁਦਰਤੀ ਵਿਵਹਾਰ ਦੇ ਨਤੀਜੇ ਵਜੋਂ ਹੋ ਸਕਦੇ ਹਨ, ਜਾਂ ਗਲਤੀਆਂ ਦੀ ਰਿਪੋਰਟ ਕੀਤੀ ਜਾ ਸਕਦੀ ਹੈ ਜਦੋਂ ਕੋਈ ਨਾ ਹੋਵੇ, ਜਿਸ ਸਥਿਤੀ ਵਿੱਚ, phpMussel ਲਈ ਆਮ ਵਿਵਹਾਰ ਉਹਨਾਂ CMS ਦੇ ਆਮ ਵਿਵਹਾਰ ਵਿੱਚ ਦਖਲਅੰਦਾਜ਼ੀ ਕਰੇਗਾ। ਜੇਕਰ ਤੁਹਾਡੇ ਲਈ ਅਜਿਹੀ ਸਥਿਤੀ ਪੈਦਾ ਹੁੰਦੀ ਹੈ, ਤਾਂ ਇਸਨੂੰ ਕਿਰਿਆਸ਼ੀਲ ਕਰਨ ਨਾਲ phpMussel ਨੂੰ ਇਹਨਾਂ ਖਾਲੀ ਤੱਤਾਂ ਲਈ ਸਕੈਨ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਨਾ ਕਰਨ ਦੀ ਹਦਾਇਤ ਹੋਵੇਗੀ, ਲੱਭੇ ਜਾਣ 'ਤੇ ਉਹਨਾਂ ਨੂੰ ਨਜ਼ਰਅੰਦਾਜ਼ ਕਰਨ ਲਈ ਅਤੇ ਕੋਈ ਵੀ ਸੰਬੰਧਿਤ ਗਲਤੀ ਸੁਨੇਹੇ ਵਾਪਸ ਨਾ ਕਰਨ ਲਈ, ਇਸ ਤਰ੍ਹਾਂ ਪੇਜ ਦੀ ਬੇਨਤੀ ਨੂੰ ਜਾਰੀ ਰੱਖਣ ਦੀ ਇਜਾਜ਼ਤ ਦਿੰਦਾ ਹੈ। False = ਅਕਿਰਿਆਸ਼ੀਲ; True = ਕਿਰਿਆਸ਼ੀਲ।"
  [pa-160, pa-Arab, pa-PK]: "ایہ ہدایت عام طور تے غیر فعال ہونی چاہیدی اے، لیکن کجھ معاملیاں وچ ایہ ضروری ہو سکدا اے کہ phpMussel نوں تہاڈے خاص سسٹم تے ٹھیک طریقے نال کم کرن لئی اینوں فعال کیتا جائے۔ عام طور تے، جدوں غیر فعال کیتا جاندا اے، جدوں phpMussel <code>$_FILES</code> array() وچ عناصر دی موجودگی دا پتہ لاندا اے، تے انہاں عناصر دے ذریعہ نمائندگی کردہ فائلاں نو سکین کرن دی کوشش کیتی جائے گی، تے، جے جے اوہ عناصر خالی ہون، phpMussel اک غلطی دا سنیہا واپس کرے گا۔ ایہ phpMussel لئی صحیح رویہ اے۔ تاہم، کجھ سی ایم ایس لئی، <code>$_FILES</code> وچ خالی عناصر انہاں سی ایم ایس دے قدرتی رویے دے نتیجے وچ ہو سکدے نیں، یا غلطیاں دی اطلاع دتی جا سکدی اے جدوں کوئی نئیں ہوندا، جس صورت وچ، phpMussel لئی عام طور تے رویہ مداخلت کرے گا اوہناں سی ایم ایس دا عام رویہ۔ جے تہاڈے لیی ایہ صورتحال پیدا ہوندی اے، تے اس نو چالو کرن نال phpMussel نو ہدایت کیتی جائے گی کہ اوہ ایہناں خالی عناصر نو سکین کرن دی کوشش نہ کرے، جدوں ملے تے انہاں نو نظر انداز کرے تے اس طرح صفحے دی درخواست نو جاری رکھن دی اجازت ملے گی۔ غلط = غیر فعال؛ سچ = فعال۔"
